<svg xmlns="http://www.w3.org/2000/svg" width="960" height="555" viewBox="0 0 960 555" role="img" aria-label="VS Code chat controls"><rect width="960" height="555" fill="#ffffff"/><text x="30" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#00594f" text-anchor="start">VS Code Chat — the 4 controls of every session</text><text x="30" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">Schematic (not a screenshot). Labels match VS Code 1.146 terminology.</text><rect x="30" y="90" width="900" height="170" rx="12" fill="#1e1e1e" stroke="#3c3c3c" stroke-width="2"/><text x="50" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#cccccc" text-anchor="start">Chat title:  Copilot · &lt;your chat&gt;     ← the harness prefix shows which harness runs this chat</text><rect x="50" y="140" width="860" height="60" rx="8" fill="#252526" stroke="#007acc" stroke-width="2"/><text x="66" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9d9d9d" text-anchor="start">Ask Copilot to …   (type # for context, / for skills &amp; commands)</text><rect x="50" y="212" width="150" height="32" rx="6" fill="#333333" stroke="#00a39a" stroke-width="2"/><text x="125" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Copilot ▾</text><rect x="220" y="212" width="150" height="32" rx="6" fill="#333333" stroke="#7c3aed" stroke-width="2"/><text x="295" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Agent ▾</text><rect x="390" y="212" width="150" height="32" rx="6" fill="#333333" stroke="#d97706" stroke-width="2"/><text x="465" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Auto ▾</text><rect x="560" y="212" width="150" height="32" rx="6" fill="#333333" stroke="#dc2626" stroke-width="2"/><text x="635" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Manual ▾</text><rect x="790" y="212" width="120" height="32" rx="6" fill="#0e639c" stroke="#0e639c" stroke-width="2"/><text x="850" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Send ➤</text><rect x="30" y="290" width="440" height="95" rx="10" fill="#f8fafb" stroke="#00a39a" stroke-width="2"/><text x="46" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#00a39a" text-anchor="start">1  Session Target = HARNESS</text><text x="46" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">Copilot (default) · Local (deprecated) · Claude · Codex · Cloud</text><text x="46" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">Choose BEFORE the first prompt.</text><rect x="490" y="290" width="440" height="95" rx="10" fill="#f8fafb" stroke="#7c3aed" stroke-width="2"/><text x="506" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="start">2  Agent = ROLE</text><text x="506" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">Ask (read-only) · Agent (makes changes) · Plan (/plan)</text><text x="506" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">+ your custom agents (.github/agents).</text><rect x="30" y="400" width="440" height="95" rx="10" fill="#f8fafb" stroke="#d97706" stroke-width="2"/><text x="46" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#d97706" text-anchor="start">3  Language model</text><text x="46" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">Auto or a specific model.</text><text x="46" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">Costs AI credits — model choice = cost choice.</text><rect x="490" y="400" width="440" height="95" rx="10" fill="#f8fafb" stroke="#dc2626" stroke-width="2"/><text x="506" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="start">4  Permissions</text><text x="506" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">Manual (default) · Assisted · Allow all</text><text x="506" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5f6b76" text-anchor="start">Approve tool calls: once / session / always.</text><text x="30" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#00594f" text-anchor="start">Open Chat: Ctrl+Alt+I (Win/Linux) · ⌃⌘I (macOS)    Customizations: Ctrl+Shift+P → Chat: Open Customizations</text></svg>